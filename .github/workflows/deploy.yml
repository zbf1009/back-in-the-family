# Deploy_Workflow (R11). On every push to `main` this runs the full gate chain
# (scripts/gates.sh) and, only when the gates pass AND deploy has been enabled by the
# Author with the two Cloudflare secrets present, deploys the Deploy_Directory
# (web/dist, built and checked by the gates in this same run) to the Cloudflare_Target.
#
# Deploy is ENABLED (web-shell task 10, 2026-11-05): `vars.DEPLOY_ENABLED` is `true`
# and both secrets are set, so every green push to `main` deploys. If either secret
# is removed or the variable is unset, the "Check deploy configuration" step prints
# the not-configured message and the deploy step is skipped (gates still run).
name: deploy

on:
  push:
    branches: [main]

# The gate/static deploy job retains read-only repository access. Only the separate
# approved artifact publisher declares write permission for exact-lease updates.
permissions:
  contents: read

# One serial group for the whole job. cancel-in-progress: false means a running deploy
# is never cancelled; GitHub keeps at most one pending run and replaces it with a newer
# one, so after all runs finish the Cloudflare_Target serves the Deploy_Directory of the
# latest pushed commit whose gates passed (R11.11).
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  gates-and-deploy:
    # Pinned to ubuntu-24.04 (NOT ubuntu-latest): the runner image ships the system
    # Chrome the Smoke_Test needs and a preinstalled rustup, and ubuntu-latest moves to
    # 26.04 in Nov 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.artifact-upload.outputs.artifact-id }}
      envelope_sha: ${{ steps.artifact-inputs.outputs.envelope_sha }}
      source_sha: ${{ steps.artifact-inputs.outputs.source_sha }}
      run_id: ${{ steps.artifact-inputs.outputs.run_id }}
      run_attempt: ${{ steps.artifact-inputs.outputs.run_attempt }}
    env:
      # The Smoke_Test uses the system Chrome; never download a Playwright browser (R9.2).
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the Rust toolchain pinned in rust-toolchain.toml (channel 1.99.1,
      # clippy + rustfmt, wasm32-unknown-unknown target) without upgrading it. rustup is
      # preinstalled on the runner; `rustup show` reads rust-toolchain.toml and installs
      # the pinned toolchain and its targets/components (R11.2).
      - name: Install pinned Rust toolchain
        run: rustup show

      # Install the mise.toml tools (wasm-bindgen-cli 0.2.130, node 26.7.0, pnpm 10.33.1)
      # at exactly their pinned versions, no upgrades (R11.2).
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      # Ubuntu's AppArmor user-namespace restriction is an OS prerequisite,
      # not a runtime fallback. Gates fail closed if isolation cannot be created.
      # All network-capable locked dependency preparation precedes gate execution.
      - name: Prepare pinned offline gate dependencies
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          scripts/prepare-gates.sh

      # Full offline gate chain, ending with Smoke_Test. Only loopback/fakes are
      # reachable; Worker_Build does not change the assets-only deployment below.
      - name: Run gates
        run: scripts/gates.sh

      # Package/check the exact successful gate bytes without rebuilding. The private
      # inputs envelope is bound independently to a job output, not public provenance.
      - name: Prepare checked artifact transport
        id: artifact-inputs
        run: |
          prepared=$(scripts/offline-gates.sh node scripts/stage-artifact.ts --prepare \
            --output target/artifact-release --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT")
          envelope_sha=$(node -e 'const p=JSON.parse(process.argv[1]); if (!/^[a-f0-9]{64}$/.test(p.envelopeSHA)) throw new Error("Invalid checked envelope SHA"); process.stdout.write(p.envelopeSHA)' "$prepared")
          scripts/offline-gates.sh node scripts/check-artifact.ts --input target/artifact-release \
            --source-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --envelope-sha "$envelope_sha"
          echo "envelope_sha=$envelope_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload immutable checked artifact transport
        id: artifact-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checked-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/artifact-release/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 7

      # Decide whether to deploy. deploy=true only when both Cloudflare secrets are
      # present AND the Author has set the DEPLOY_ENABLED repository variable to 'true';
      # otherwise print the not-configured message and leave deploy skipped (R11.7).
      - name: Check deploy configuration
        id: cfg
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          ENABLED: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          if [ "$HAS_TOKEN$HAS_ACCOUNT$ENABLED" = "truetruetrue" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Deployment is not configured (token: $HAS_TOKEN, account: $HAS_ACCOUNT, enabled: $ENABLED); skipping deploy."
          fi

      # Deploy the web/dist that the gates built and checked in this same run, with no
      # rebuild (R11.3). Runs only when the gates passed (a failed gate step stops the
      # job here, R11.4) and deploy is configured. The two secrets are read from GitHub
      # Actions secrets and exist ONLY in this step's environment (R11.5). No retry
      # step: a failed deploy fails the job and the previous version keeps serving
      # (R11.10).
      - name: Deploy web/dist
        if: steps.cfg.outputs.deploy == 'true'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mise exec -- pnpm exec wrangler deploy

  # Publish only to the permanent target separately approved by the Author in 8.1.
  # Missing or mismatched approval/ref inputs leave publication disabled.
  publish-artifact:
    if: ${{ vars.ARTIFACT_PUBLICATION_APPROVED == '8.1' && vars.ARTIFACT_TARGET_REF == 'refs/heads/cloudflare-deploy' }}
    needs: gates-and-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: artifact-branch-writer
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "false"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Explicit permanent-publication inputs; first creation requires approved absence.
      BIF_ARTIFACT_TARGET_REF: ${{ vars.ARTIFACT_TARGET_REF }}
      BIF_ARTIFACT_PUBLICATION_APPROVED: ${{ vars.ARTIFACT_PUBLICATION_APPROVED }}
      BIF_ARTIFACT_EXPECT_ABSENT: ${{ vars.ARTIFACT_EXPECT_ABSENT }}
    steps:
      - name: Check out exact checked source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gates-and-deploy.outputs.source_sha }}
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false

      # Preparation may use the network, but it installs only the existing pinned
      # Node/pnpm and frozen checker SDK closure. No Rust/app/Worker compilation.
      - name: Prepare pinned checker dependencies
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mise install node@26.7.0 pnpm@10.33.1
          node=$(mise which node)
          pnpm=$(mise which pnpm)
          export PATH="$(dirname "$node"):$(dirname "$pnpm"):$PATH"
          "$pnpm" --dir web install --frozen-lockfile
          echo "CHECKER_NODE=$node" >> "$GITHUB_ENV"

      - name: Download only this gate's immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.gates-and-deploy.outputs.artifact_id }}
          path: target/artifact-release
          merge-multiple: true

      - name: Check downloaded artifact offline without rebuilding
        env:
          CHECKED_SOURCE: ${{ needs.gates-and-deploy.outputs.source_sha }}
          CHECKED_RUN_ID: ${{ needs.gates-and-deploy.outputs.run_id }}
          CHECKED_RUN_ATTEMPT: ${{ needs.gates-and-deploy.outputs.run_attempt }}
          CHECKED_ENVELOPE_SHA: ${{ needs.gates-and-deploy.outputs.envelope_sha }}
        run: |
          isolated_home=$(mktemp -d)
          trap 'rm -rf "$isolated_home"' EXIT
          env -i PATH="$(dirname "$CHECKER_NODE"):/usr/bin:/bin" HOME="$isolated_home" TMPDIR="$isolated_home" \
            WRANGLER_SEND_METRICS=false CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV=false CLOUDFLARE_INCLUDE_PROCESS_ENV=false \
            /usr/bin/unshare --user --map-root-user --net --fork /bin/bash -c \
            'set -euo pipefail; /usr/bin/ip link set lo up; exec "$@"' artifact-offline \
            "$CHECKER_NODE" scripts/check-artifact.ts --input target/artifact-release \
            --source-commit "$CHECKED_SOURCE" --run-id "$CHECKED_RUN_ID" \
            --run-attempt "$CHECKED_RUN_ATTEMPT" --envelope-sha "$CHECKED_ENVELOPE_SHA"

      # Read-only discovery precedes staging. An absent target is accepted ONLY with
      # the separately approved explicit absent-ref input; it is never an overwrite default.
      - name: Capture expected artifact predecessor
        id: artifact-prior
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKED_SOURCE: ${{ needs.gates-and-deploy.outputs.source_sha }}
          CHECKED_RUN_ID: ${{ needs.gates-and-deploy.outputs.run_id }}
          CHECKED_RUN_ATTEMPT: ${{ needs.gates-and-deploy.outputs.run_attempt }}
          CHECKED_ENVELOPE_SHA: ${{ needs.gates-and-deploy.outputs.envelope_sha }}
        run: |
          "$CHECKER_NODE" scripts/publish-artifact.ts --ci-capture-prior \
            --artifact-ref "$BIF_ARTIFACT_TARGET_REF" --source-commit "$CHECKED_SOURCE" \
            --run-id "$CHECKED_RUN_ID" --run-attempt "$CHECKED_RUN_ATTEMPT" \
            --envelope-sha "$CHECKED_ENVELOPE_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish checked artifact branch with an exact lease
        if: ${{ vars.ARTIFACT_PUBLICATION_APPROVED == '8.1' && vars.ARTIFACT_TARGET_REF == 'refs/heads/cloudflare-deploy' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKED_SOURCE: ${{ needs.gates-and-deploy.outputs.source_sha }}
          CHECKED_RUN_ID: ${{ needs.gates-and-deploy.outputs.run_id }}
          CHECKED_RUN_ATTEMPT: ${{ needs.gates-and-deploy.outputs.run_attempt }}
          CHECKED_ENVELOPE_SHA: ${{ needs.gates-and-deploy.outputs.envelope_sha }}
          EXPECTED_PRIOR_OID: ${{ steps.artifact-prior.outputs.oid }}
        run: |
          "$CHECKER_NODE" scripts/publish-artifact.ts --ci --project-root "$GITHUB_WORKSPACE" \
            --input target/artifact-release --artifact-ref "$BIF_ARTIFACT_TARGET_REF" \
            --expected-prior-oid "$EXPECTED_PRIOR_OID" --source-commit "$CHECKED_SOURCE" \
            --run-id "$CHECKED_RUN_ID" --run-attempt "$CHECKED_RUN_ATTEMPT" \
            --envelope-sha "$CHECKED_ENVELOPE_SHA" >> "$GITHUB_STEP_SUMMARY"
