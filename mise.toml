# Project-local tools. Versions must match Cargo.toml where noted.
[tools]
# Must equal the `wasm-bindgen` crate version in Cargo.toml (schema check).
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
# Runs wasm-bindgen-test-runner output.
node = "26.7.0"
# Package manager for the web/ app; must equal web/package.json packageManager (scripts/check-pnpm-version.sh checks this).
pnpm = "10.33.1"
