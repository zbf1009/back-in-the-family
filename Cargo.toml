[workspace]
resolver = "3"
members = ["crates/sim-core", "crates/sim-wasm", "crates/sim-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Debug builds hash slowly, and the per-tick checksum is most of a property-test run.
# Optimising this one dependency keeps `cargo test` inside the time budget; no code
# change (design "Testing Strategy").
[profile.dev.package.blake3]
opt-level = 3
