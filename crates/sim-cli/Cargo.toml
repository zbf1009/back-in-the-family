[package]
name = "sim-cli"
description = "Native headless runner for sim-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sim-core = { path = "../sim-core" }
# Reads the `--config` file (the `ReplayConfig` shape from sim-core). Same version
# requirement as sim-core's own dependency.
serde_json = "1.0.154"

[dev-dependencies]
# The same path crate, so `Cargo.lock` gains no package. Unit tests need the
# `test-support` feature for `Sim::new_with_params` and `Params::DEFAULT` mutation
# (the wait-bound scenario in `batch.rs` sets both birth rates to 0).
sim-core = { path = "../sim-core", features = ["test-support"] }
# Property tests 20–22 drive the real Auto_Player with 100 stress worlds each.
proptest = "1.12.0"

[lints]
workspace = true
