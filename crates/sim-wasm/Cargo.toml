[package]
name = "sim-wasm"
description = "wasm-bindgen bindings for sim-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
# Benchmark-only export used by scripts/measure-wasm.sh. Off by default so the shipping
# artifact built by scripts/wasm-build.sh does not contain it.
bench = []

[dependencies]
sim-core = { path = "../sim-core" }
wasm-bindgen = "=0.2.130"

[dev-dependencies]
serde_json = "1.0.154"
wasm-bindgen-test = "0.3.80"
